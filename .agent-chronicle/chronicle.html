<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>How it was built</title>
<style>
:root{
  --paper:#F2F3EF;--surface:#FBFBF9;--ink:#18202B;--ink-2:#465060;--ink-3:#5F6875;--rule:#D6D9D2;--rule-2:#BFC5BC;
  --accent:#1F5C4D;--accent-soft:#DFE9E3;--band-a:#E4EBE6;--band-b:#ECEEE9;--bar:#55687E;--tick:#1F5C4D;
  --pivot:#8A3D73;--pivot-soft:#F1E1EC;--ok:#1E6A43;--ok-bg:#DCEDE2;--part:#7F5300;--part-bg:#F4E8CB;
  --gone:#545C67;--gone-bg:#E2E4E0;--rev:#A0302A;--rev-bg:#F6DFDB;--exp:#2D4F93;--exp-bg:#DFE6F4;
  --scrim:rgba(16,22,30,.38);--shadow:0 1px 0 rgba(24,32,43,.04),0 10px 28px -14px rgba(24,32,43,.22);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media screen and (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121619;--surface:#1A1F24;--ink:#E6E8E3;--ink-2:#B7BEC6;--ink-3:#97A0AA;--rule:#2A3138;--rule-2:#3D464F;
  --accent:#8DC7AF;--accent-soft:#1D2C27;--band-a:#18241F;--band-b:#1C2126;--bar:#8496AB;--tick:#8DC7AF;
  --pivot:#DDA3CB;--pivot-soft:#33232F;--ok:#8FD3A8;--ok-bg:#1B2E23;--part:#E2BE6E;--part-bg:#2F2817;
  --gone:#AEB5BD;--gone-bg:#262B31;--rev:#F0A39A;--rev-bg:#3A201D;--exp:#A5BEF0;--exp-bg:#1E2638;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark;
}}
@media screen{:root[data-theme="dark"]{
  --paper:#121619;--surface:#1A1F24;--ink:#E6E8E3;--ink-2:#B7BEC6;--ink-3:#97A0AA;--rule:#2A3138;--rule-2:#3D464F;
  --accent:#8DC7AF;--accent-soft:#1D2C27;--band-a:#18241F;--band-b:#1C2126;--bar:#8496AB;--tick:#8DC7AF;
  --pivot:#DDA3CB;--pivot-soft:#33232F;--ok:#8FD3A8;--ok-bg:#1B2E23;--part:#E2BE6E;--part-bg:#2F2817;
  --gone:#AEB5BD;--gone-bg:#262B31;--rev:#F0A39A;--rev-bg:#3A201D;--exp:#A5BEF0;--exp-bg:#1E2638;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);overflow-wrap:break-word}
body.locked{overflow:hidden}
[hidden]{display:none!important}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-999px;top:8px}.skip:focus{left:16px;z-index:99;background:var(--surface);padding:8px 12px}
.prose{font:18px/1.62 var(--serif);white-space:pre-wrap;max-width:68ch;margin:0 0 14px}
.lbl{font:600 13px/1.3 var(--sans);color:var(--ink-3);margin:0 0 4px}
.muted{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
/* masthead */
.masthead{padding:28px 0 36px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:56px}
.proj{margin:0;font:600 15px/1.3 var(--sans)}
.proj .remote{font-weight:400;color:var(--ink-3);margin-left:10px}
.controls{display:flex;gap:8px}
.ctl{font:500 14px/1 var(--sans);color:var(--ink);background:transparent;border:1px solid var(--rule-2);border-radius:6px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ctl:hover{border-color:var(--ink-3)}
.ctl svg{width:15px;height:15px}
.ctl-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ctl-primary:hover{opacity:.9;border-color:var(--ink)}
.eyebrow{margin:0 0 14px;font:600 15px/1.2 var(--sans);color:var(--accent)}
.headline{margin:0 0 20px;font:400 clamp(32px,5.2vw,56px)/1.1 var(--serif);letter-spacing:-.012em;max-width:24ch;white-space:pre-wrap}
.headline.long{font-size:clamp(24px,3.2vw,36px);line-height:1.2;max-width:38ch}
.span{margin:0 0 36px;font-size:17px;color:var(--ink-2)}
.ledger{display:flex;flex-wrap:wrap;margin:0;border-top:1px solid var(--ink);padding-top:16px;row-gap:18px}
.st{display:flex;flex-direction:column-reverse;justify-content:flex-end;padding:0 26px 0 0;margin-right:26px;border-right:1px solid var(--rule)}
.st:last-child{border-right:0}
.st dt{font-size:13px;color:var(--ink-3)}
.st dd{margin:0}
.st-v{display:block;font:600 26px/1.15 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.st-v.small{font-size:16px;line-height:30px;font-weight:600}
.st-sub{display:block;font-size:13px;color:var(--ink-3)}
.prehist{margin:16px 0 0;font-size:14px;color:var(--ink-3)}
/* sections */
.sec{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px 40px;padding:44px 0;border-top:1px solid var(--rule)}
.sec.wide{grid-template-columns:minmax(0,1fr)}
.sec h2{margin:0;font:400 24px/1.2 var(--serif)}
.sec-note{margin:6px 0 0;font-size:14px;color:var(--ink-3);max-width:60ch}
.sec-body{min-width:0}
/* evidence chip */
.ev{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--sans);color:var(--ink-2);background:transparent;border:1px solid var(--rule-2);border-radius:999px;padding:5px 10px 5px 8px;cursor:pointer;vertical-align:middle;white-space:nowrap}
.ev:hover{border-color:var(--accent);color:var(--accent)}
.ev svg{width:12px;height:12px}
.ev-row{margin:10px 0 0}
/* badges & glyphs */
.badge{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--sans);color:var(--c);background:var(--cb);border-radius:999px;padding:5px 9px 5px 7px;white-space:nowrap}
.glyph{width:12px;height:12px;flex:none;overflow:visible}
.gf{fill:currentColor}.gs{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.o-shipped{--c:var(--ok);--cb:var(--ok-bg)}.o-partial{--c:var(--part);--cb:var(--part-bg)}.o-abandoned{--c:var(--gone);--cb:var(--gone-bg)}
.o-reverted{--c:var(--rev);--cb:var(--rev-bg)}.o-exploration{--c:var(--exp);--cb:var(--exp-bg)}.o-other{--c:var(--ink-2);--cb:var(--rule)}
.pv{--c:var(--pivot);--cb:var(--pivot-soft)}
/* timeline */
.tl-box{overflow-x:auto;overflow-y:hidden;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:10px 0 4px}
.tl{display:block}
.tl .band-a{fill:var(--band-a)}.tl .band-b{fill:var(--band-b)}
.tl .band-t{font:600 12px var(--sans);fill:var(--ink-2)}
.tl .bar{fill:var(--bar)}.tl .bar:hover{fill:var(--ink)}
.tl .base{stroke:var(--rule-2);stroke-width:1}
.tl .tick{stroke:var(--tick)}.tl .tick.rev{stroke:var(--rev)}
.tl .ax{font:12px var(--sans);fill:var(--ink-3)}.tl .axl{stroke:var(--rule-2)}
.tl .pvl{stroke:var(--pivot);stroke-width:1;stroke-dasharray:2 3}
.tl .pvm{color:var(--pivot);cursor:pointer;outline:none}
.tl .pvm .halo{fill:var(--surface);stroke:none}
.tl .pvm:focus-visible .halo,.tl .pvm:hover .halo{fill:var(--pivot-soft);stroke:var(--pivot)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.legend li{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:10px;height:12px;background:var(--bar)}
.sw.tk{width:2px;height:12px;background:var(--tick)}.sw.tk.rev{background:var(--rev)}
.sw.bd{width:16px;height:12px;background:var(--band-a);border:1px solid var(--rule-2)}
.legend .glyph{color:var(--pivot)}
/* origin */
.lead{font:400 22px/1.45 var(--serif);max-width:44ch;margin:0 0 24px;white-space:pre-wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin:24px 0}
.list{margin:0;padding:0 0 0 1.1em;font:17px/1.55 var(--serif)}
.list li{margin:0 0 6px;white-space:pre-wrap}
.plan{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:8px 0 0}
.plan .prose{margin:0;font-size:16.5px}
/* storyboard */
.strip-nav{display:flex;gap:8px;margin:0 0 14px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:min(400px,86%);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 18px;align-items:start;overscroll-behavior-x:contain}
.frame{scroll-snap-align:start;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:20px 20px 22px;box-shadow:var(--shadow);min-width:0}
.pos{position:relative;height:4px;background:var(--rule);border-radius:2px;margin:0 0 16px}
.pos span{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:2px;min-width:3px}
.frame-num{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 6px;font:600 13px/1.3 var(--sans);color:var(--accent)}
.frame-num .d{font-weight:400;color:var(--ink-3)}
.frame h3{margin:0 0 12px;font:400 24px/1.2 var(--serif)}
.frame .prose{font-size:16.5px;margin-bottom:12px}
.goal{border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 14px}
.goal .gt{margin:0;font:italic 16.5px/1.5 var(--serif);white-space:pre-wrap}
.sub-h{margin:20px 0 8px;font:600 13px/1.3 var(--sans);color:var(--ink-3)}
.eps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ep{border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.ep-head{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;cursor:pointer;border-radius:6px}
.ep-head:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
div.ep-head{cursor:default}
.ep-t{font:600 15px/1.35 var(--sans)}
.ep-r{display:flex;align-items:center;gap:8px;flex:none}
.chev{width:14px;height:14px;color:var(--ink-3);transition:transform .15s}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ep-body{padding:0 12px 12px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 8px;font-size:13px;color:var(--ink-3)}
.ep-body .prose{font-size:15.5px;margin:0}
.pvs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pvs li{font-size:14.5px;line-height:1.45}
.pvs .ft{display:block;margin-top:5px;color:var(--ink-2);white-space:pre-wrap}
/* drift */
.drift{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);align-items:stretch;margin:0 0 32px}
.drift .card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px 20px}
.drift .card.now{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.drift .arrow{display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.drift .prose{margin:0;font-size:17px}
.shifts{list-style:none;margin:0;padding:0;max-width:72ch}
.shifts li{position:relative;padding:0 0 26px 30px}
.shifts li::before{content:"";position:absolute;left:5px;top:12px;bottom:-4px;width:1px;background:var(--rule-2)}
.shifts li:last-child::before{display:none}
.shifts li::after{content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:50%;border:2px solid var(--accent);background:var(--paper)}
.shifts .what{margin:2px 0 4px;font:600 18px/1.4 var(--serif);white-space:pre-wrap}
.shifts .why{margin:0;color:var(--ink-2);white-space:pre-wrap;max-width:64ch}
/* pivots */
.pivots{list-style:none;margin:0;padding:0}
.pivot{padding:0 0 26px;margin:0 0 26px;border-bottom:1px solid var(--rule)}
.pivot:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.pivot:focus{outline:none}.pivot:target,.pivot.flash{background:linear-gradient(var(--pivot-soft),var(--pivot-soft)) no-repeat 0 0/4px 100%}
.pv-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;font-size:14px;color:var(--ink-3)}
.fromto{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px 12px;margin:0 0 10px;max-width:72ch}
.fromto dt{font:600 13px/1.6 var(--sans);color:var(--ink-3)}
.fromto dd{margin:0;font:17px/1.5 var(--serif);white-space:pre-wrap}
.fromto dd.to{font-weight:600}
.why{margin:0 0 8px;color:var(--ink-2);white-space:pre-wrap;max-width:68ch}
.cost{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* shipped & lists */
.rows{list-style:none;margin:0;padding:0}
.rows>li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 20px;padding:14px 0;border-top:1px solid var(--rule)}
.rows>li:first-child{border-top:0;padding-top:0}
.rows .when{font-size:14px;color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums}
.rows .what{margin:0;font:17.5px/1.5 var(--serif);white-space:pre-wrap}
.rows .meta{margin:4px 0 0}
.notes{list-style:none;margin:0;padding:0;max-width:72ch}
.notes li{position:relative;padding:0 0 18px 22px;font:17.5px/1.55 var(--serif)}
.notes li::before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:1.5px;background:var(--accent)}
.notes.open li::before{width:7px;height:7px;top:.55em;border:1.5px solid var(--ink-3);background:none;border-radius:50%}
.notes .t{white-space:pre-wrap}
.notes .ev{margin-left:8px}
/* footer */
.foot{border-top:1px solid var(--rule);margin-top:24px;padding:28px 0 56px;font-size:14px;color:var(--ink-3)}
.foot p{margin:0 0 6px;max-width:80ch}
.foot .facts{color:var(--ink-2)}
.empty{padding:48px 0;color:var(--ink-3)}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--rule);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--rule)}
.dr-head h2{margin:2px 0 0;font:400 20px/1.3 var(--serif)}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:6px;color:var(--ink-2);flex:none}
.x:hover{background:var(--paper)}.x:focus-visible{outline:2px solid var(--accent)}
.dr-list{list-style:none;margin:0;padding:6px 22px 32px;overflow:auto}
.dr-list li{padding:16px 0;border-bottom:1px solid var(--rule)}
.dr-list li:last-child{border-bottom:0}
.dr-label{margin:0;font:600 14px/1.4 var(--sans)}
.dr-sess{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.dr-q{margin:10px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--rule-2);font:15.5px/1.55 var(--serif);color:var(--ink-2);white-space:pre-wrap;max-height:16em;overflow:auto}
.dr-link{display:inline-block;margin-top:10px;font-size:14px;font-weight:500}
.dr-id{font:13px var(--mono);color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){
  #drawer{animation:dr-in .22s ease-out}
  @keyframes dr-in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes dr-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
}
/* present */
#present{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column}
#present:focus{outline:none}
.p-stage{flex:1;overflow:auto;display:flex;padding:clamp(24px,7vh,80px) clamp(20px,7vw,120px)}
.pf{margin:auto 0;width:100%;max-width:1180px;font-size:clamp(18px,1.9vw,26px);line-height:1.45}
.pf .kick{margin:0 0 .6em;font:600 clamp(15px,1.4vw,20px)/1.3 var(--sans);color:var(--accent);display:flex;gap:1em;flex-wrap:wrap}
.pf .kick .d{color:var(--ink-3);font-weight:400}
.pf h2{margin:0 0 .45em;font:400 clamp(36px,5.4vw,80px)/1.05 var(--serif);letter-spacing:-.015em;white-space:pre-wrap}
.pf .plead{margin:0 0 1em;font:400 clamp(22px,2.7vw,40px)/1.3 var(--serif);max-width:34ch;white-space:pre-wrap}
.pf .pbody{margin:0 0 1em;font-family:var(--serif);max-width:52ch;white-space:pre-wrap;color:var(--ink-2)}
.pf .pstats{display:flex;flex-wrap:wrap;gap:1.2em 2.4em;margin:1.4em 0 0;padding-top:.8em;border-top:2px solid var(--ink)}
.pf .pstats b{display:block;font:600 clamp(28px,3.6vw,52px)/1.1 var(--sans);font-variant-numeric:tabular-nums}
.pf .pstats span{font-size:.75em;color:var(--ink-3)}
.pf .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1.4em 2.4em;margin-top:.6em}
.pf .plist{list-style:none;margin:0;padding:0}
.pf .plist li{padding:.5em 0;border-top:1px solid var(--rule);display:flex;gap:.8em;align-items:baseline;flex-wrap:wrap;white-space:pre-wrap}
.pf .badge{font-size:max(13px,.62em)}
.pf .glyph{width:.6em;height:.6em}
.pf .lbl{font-size:.7em}
.pf .pwhy{flex-basis:100%;font-family:var(--serif);color:var(--ink-2);font-size:.85em}
.pf .card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:.9em 1.1em;white-space:pre-wrap;font-family:var(--serif)}
.pf .card.now{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.p-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,4vw,40px);border-top:1px solid var(--rule);position:relative}
.p-prog{position:absolute;left:0;top:-1px;height:2px;background:var(--accent)}
.p-count{font:500 15px var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums}
.p-nav{display:flex;gap:8px}
@media (max-width:760px){
  .sec{grid-template-columns:minmax(0,1fr);padding:36px 0}
  .strip{grid-auto-flow:row;grid-auto-columns:auto;overflow:visible;scroll-snap-type:none;padding:0}
  .strip-nav{display:none}
  .drift{grid-template-columns:minmax(0,1fr)}
  .drift .arrow{height:36px;transform:rotate(90deg)}
  .rows>li{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .topbar{margin-bottom:36px}
  .proj .remote{display:block;margin:2px 0 0}
  .ledger{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
  .st{padding:0;margin:0;border:0}
  .st-v{font-size:22px}
  .lead{font-size:20px}
  #drawer{top:auto;left:0;width:100%;max-height:82vh;border-left:0;border-top:1px solid var(--rule);border-radius:14px 14px 0 0;animation-name:dr-up}
  .p-bar .ctl{padding:9px 10px}
}
@media print{
  body{background:#fff;font-size:11pt}
  .controls,.ev,.ev-row,.strip-nav,.chev,#drawer,.scrim,#present,.skip{display:none!important}
  .ep-body[hidden]{display:block!important}
  .masthead{padding-top:0}.topbar{margin-bottom:24px}
  .sec{grid-template-columns:150px minmax(0,1fr);padding:24px 0;break-inside:auto}
  .sec h2,.frame h3,.sub-h{break-after:avoid}
  .strip{display:block;overflow:visible;padding:0}
  .frame{box-shadow:none;margin:0 0 14px;break-inside:avoid}
  .tl-box{overflow:visible;border:0;padding:0}.tl{width:100%;height:auto}
  .pivot,.rows>li,.shifts li,.ep,.drift{break-inside:avoid}
  a{color:inherit}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to report</a>

g and blocking behavior work for an enterprise LiteLLM deployment and for agents.", "summary": "The enterprise's practice of avoiding during-call guardrails was confirmed: a mid-call block cancels inference and leaves no spend record. Checks stayed before the call, plus after it only for responses with tool calls, and the guard was made to fail open. A new agent-loop eval showed guardrails stopped attacks but ended agent tasks, so blocks became normal refusal replies and every call path was proven billable.", "episodes": ["ep10", "ep11", "ep12"], "evidence": ["6631ec42:2450", "6631ec42:2474", "c:c238a2b", "6631ec42:2865"], "start": "2026-10-05", "end": "2026-10-05"}, {"id": "ch5", "title": "Hardening the AI judge against cyber attacks hit a ceiling", "goal": "Simplify cyber-guard and harden it against attacker-style cyber requests without raising false alarms.", "summary": "An ablation trimmed cyber-guard's prompts. Hardening the policy wording was blocked by Claude's safety classifier, so the work moved to a Codex session through a written spec and later a handoff. Neither agent's rewording rounds brought false flags down, and the adopted v4 transferred a few targeted rules onto the original policy. The README swung from leading with cyber-guard back to presenting the repo as a comparison lab.", "episodes": ["ep13", "ep14", "ep15"], "evidence": ["6631ec42:2961", "6631ec42:2962", "01a11125:196", "01a11125:308", "01a11125:309"], "start": "2026-10-06", "end": "2026-10-06"}, {"id": "ch6", "title": "A simpler drop-in guardrail became the one to deploy", "goal": "Produce a guardrail that drops into an existing enterprise LiteLLM deployment as one Python file plus config, with no cache.", "summary": "Questions about tool results and system prompts exposed that cyber-guard fired many parallel judge calls per agent step and depended on a cache. Under a strict no-cache, drop-in constraint, the agent built agentic-security with at most one judge call on each side of the model thout beating the top guards. A roadmap recorded untried options such as Jev via OpenRouter and OpenAI Decisions API access.", "outcome": "shipped", "sessions": ["6631ec42", "560b4dc2"], "commits": ["f58c099"], "evidence": ["6631ec42:2330", "6631ec42:2331", "6631ec42:2340", "6631ec42:2363", "6631ec42:2410", "6631ec42:2418", "c:f58c099"], "start": "2026-10-05", "end": "2026-10-05"}, {"id": "ep10", "title": "Guardrail placement, chargeback and fail-open", "summary": "The user explained that the enterprise avoids during-call guardrails because a block cuts inference off and its cost cannot be charged back, and asked for verification. The agent confirmed from LiteLLM source and a live spend-database test that a blocking during-call guardrail cancels inference and records no spend, so blocking stayed pre-call. Post-call checks were kept only for responses containing tool calls, the last point before a tool's side effect, with an operator-maintained skip list of exact tool names. The action check gained the user's mid-task replies and app rules as trusted context after tuning showed false blocks on user-approved actions, and the gateway guard was made to fail open within a total time budget.", "outcome": "shipped", "sessions": ["6631ec42", "5a002753"], "commits": ["2b6a283"], "evidence": ["6631ec42:2450", "6631ec42:2474", "6631ec42:2475", "6631ec42:2510", "6631ec42:2595", "6631ec42:2613", "c:2b6a283"], "start": "2026-10-05", "end": "2026-10-05"}, {"id": "ep11", "title": "Standalone agent-loop eval", "summary": "The agent built an agent-loop evaluation inside this repo from vanilla Inspect AgentDojo and AgentThreatBench tasks, a minimal shim, and a hard wiring preflight, because earlier attempts elsewhere had API-key and guardrail wiring bugs and the user wanted no dependency on another repo. Runs with and without guardrails showed the guardrails caught attacks but lowered task success, because a blocked call ended the whole agent task.", "outcome": "shipped", "sessions": ["6631ec42", "4ee70eb4"], "commits": ["c238a2b"], "evidence": ["6631ec42:2634", "6631ec42:2635", "6631ec42:2697", "c:c238a2b", "6631ec42:2768"], "start": "2026-10-05", "end": "2026-10-05"}, {"id": "ep12", "title": "Blocks as refusals, and billing on every path", "summary": "Because an HTTP 400 block ended the agent loop and most model APIs signal safety blocks as a normal 200 reply with a refusal, the agent made 200 content_filter refusals the default per guardrail and kept the 400 as an option. Post-call blocks then turned out to be recorded as zero-cost failures, so the blocked reply is now rewritten into the refusal and the call completes and is billed; a chargeback check script proved spend on every billing path. Long content is judged in windows.", "outcome": "shipped", "sessions": ["6631ec42", "b9a8c5f2"], "commits": ["7337259"], "evidence": ["6631ec42:2768", "6631ec42:2784", "6631ec42:2785", "6631ec42:2865", "c:7337259"], "start": "2026-10-05", "end": "2026-10-05"}, {"id": "ep13", "title": "Simplifying cyber-guard and leading the README with it", "summary": "The user asked to make cyber-guard the README's primary story, strip prompt complexity that added no value, and harden it against attacker-style cyber requests. An ablation of each prompt section showed the Examples section added no measurable value while adding substantial input cost, so it was dropped; every other section measurably helped. The README was restructured to lead with cyber-guard and a cyber-only eval slice was added.", "outcome": "shipped", "sessions": ["6631ec42", "bbee6e46"], "commits": ["6c775d8"], "evidence": ["6631ec42:2867", "6631ec42:2961", "c:6c775d8"], "start": "2026-10-06", "end": "2026-10-06"}, {"id": "ep14", "title": "Hardening the cyber policy across two agents", "summary": "Claude's attempts to write hardened cyber policy text were stopped by its safety classifier, so at the user's request it wrote docs/cyber-policy-plan.md, a self-contained spec, and a Codex session implemented it, strengthening reconnaissance and discovery checks. Claude re-ran the resulting v3 without the shared result cache and found it caught more attacks but flagged more legitimate security work than the target; its own tuning rounds and a second-look review harness did not reduce false flags, so it wrote a handoff doc. The user also named attack types from work evals that cyber-guard missed, which could not be measured without matching test data. Codex picked up the handoff and tested many more wordings; none passed the false-flag gate and v3 was restored. When the user asked how results compared with the original policy, Codex found it had been using v3 as the baseline, which hid the larger gain from the first rewrite. A narrow transfer of v3's profiling and trusted-identity deception rules onto the original v1 became v4, keeping most of the recall gain with far fewer false positives, and was adopted.", "outcome": "shipped", "sessions": ["6631ec42", "01a11125"], "commits": ["175dc2c", "feab7a6"], "evidence": ["6631ec42:2899", "6631ec42:2962", "c:175dc2c", "01a11125:1", "6631ec42:3012", "6631ec42:3030", "6631ec42:3039", "01a11125:74", "01a11125:196", "01a11125:256", "01a11125:308"], "start": "2026-10-06", "end": "2026-10-06"}, {"id": "ep15", "title": "Re-centering the README on the comparison lab", "summary": "Once v4 was adopted, the user said the README made the project read like a cyber-guard repository and asked to center it on comparing the guardrail approaches, with the LLM judge and fine-tuned decision model presented as the project's own customizations. Codex rewrote the README that way and renamed the judge guards model-neutrally to cyber-guard and cyber-guard-per-policy across registry, gateway, evals and docs, since the judge model is configuration. Both commits were pushed.", "outcome": "shipped", "sessions": ["01a11125"], "commits": ["feab7a6", "44a9f25"], "evidence": ["01a11125:309", "01a11125:335", "01a11125:350", "c:feab7a6", "c:44a9f25"], "start": "2026-10-06", "end": "2026-10-06"}, {"id": "ep16", "title": "Tool-result redaction inside cyber-guard (parked)", "summary": "Working through the backlog, the agent began adding tool-result redaction and a delegated-intent rule to cyber-guard. The user stopped an eval so both changes could be built before a single run, then halted the work to ask how system prompts and tool results were handled. The answers showed cyber-guard judged each message and tool piece in separate parallel calls, many per agent step, and relied on a verdict cache to stay affordable. Once the user ruled out any cache, the redaction work was stashed as superseded and later dropped.", "outcome": "abandoned", "sessions": ["6631ec42"], "commits": [], "evidence": ["6631ec42:3057", "6631ec42:3174", "6631ec42:3193", "6631ec42:3199", "6631ec42:3202", "6631ec42:3208", "6631ec42:3618"], "start": "2026-10-07", "end": "2026-10-07"}, {"id": "ep17", "title": "agentic-security: a drop-in guardrail with no cache", "summary": "Under the constraint of a Python file plus config dropped into a LiteLLM deployment the user does not control, with no cache or extra infrastructure, the agent designed and built agentic-security: at most one judge call before and one after each model call, over a fixed window of recent messages, with no system prompt by default. After a user correction the deployable module moved to a standalone deploy folder, separate from the lab adapter. A second prompt version caught far fewer cyber attacks than the first, so a third scoped the delegation rule more narrowly. A latency benchmark run alongside the agent eval was invalidated by shared OpenAI rate limits and rerun. agentic-security then matched cyber-guard on most lab slices, trailing slightly on cyber held-out, used fewer judge calls, and completed more agent tasks under attack, though still fewer than with no guardrail. Surgical withholding of only the injected lines in a flagged tool result, hedged judge calls, and a fix stopping client-controlled metadata from overriding the proxy's caller identity were committed, and the deployment docs now recommend agentic-security with cyber-guard as a lab reference.", "outcome": "shipped", "sessions": ["6631ec42", "9ababef5"], "commits": ["5000ebc", "2004054"], "evidence": ["6631ec42:3203", "6631ec42:3204", "6631ec42:3207", "6631ec42:3255", "6631ec42:3369", "6631ec42:3447", "6631ec42:3527", "6631ec42:3575", "6631ec42:3616", "c:5000ebc", "c:2004054"], "start": "2026-10-07", "end": "2026-10-07"}, {"id": "ep18", "title": "Proving agentic-security protects a weaker agent", "summary": "With the deployable core committed, the user asked for one more cyber recall tuning round under a strict rule that F1 must improve with no added false positives, then a weaker agent and a clean agent run. The tuning round caught a few more attacks on one check, but on broader checks false positives rose as much as recall, so it was reverted and documented: closing the gap would need changes to the cyber policy that cyber-guard shares. The clean rerun with the strong gpt-6-luna agent showed agentic-security let far more tasks finish under attack than cyber-guard. The user challenged that this table showed task completion, not attack success. The per-sample breakdown showed the strong model resisted nearly every attack on its own, so the guardrail had little to stop, and the autonomy-hijack attacks that succeeded with no guardrail also got through agentic-security. Against a weaker local Gemma 4 agent that did fall for attacks, agentic-security stopped every attack that succeeded without a guardrail, including money theft and data leaks in the banking suite, with the caveat of small samples from one suite. The results and the rejected round were committed. A security review of the eval and tuning scripts recorded no findings.", "outcome": "shipped", "sessions": ["6631ec42", "067ecd0a"], "commits": ["0e392b8"], "evidence": ["6631ec42:3633", "6631ec42:3720", "6631ec42:3723", "6631ec42:3728", "6631ec42:3734", "c:0e392b8", "067ecd0a:17"], "start": "2026-10-07", "end": "2026-10-08"}, {"id": "ep19", "title": "Jev: a hosted decision API tuned into a fast guardrail", "summary": "The user next turned to Jev, TypeSafe's hosted System One decision model on OpenRouter, and left the agent to tune and test it overnight; the agent wrote its success criteria down first. It added a Jev adapter, a tuning harness and tests, and tuned question sets on dev data only. Two levers mattered most: giving Jev the judge's own policy text as its question, which carried the judge's tuning straight over, and telling it what the user asked for when judging a tool call, which sharply cut false alarms on legitimate tool calls. OpenRouter credits ran out before the held-out test, and the agent stopped rather than work around it, as the user had earlier asked. On the user's request the README was restructured to lead with where work is active and which options perform well. After a top-up, giving Jev the app's system prompt for tool calls added a last gain. On held-out data tuned Jev led both judges on overall, public and tool-call F1, trailed cyber-guard slightly on cyber, and ran much faster. Standalone it flagged more legitimate cyber and public requests than the judge, so it was positioned as a pre-filter that clears low-risk checks and leaves the rest to the judge; a replay of stored results, not a live combined guardrail, showed the judge's quality unchanged under that setup. Security reviews of the Jev guard and the pre-filter experiment recorded no findings.", "outcome": "shipped", "sessions": ["6631ec42", "c014a60d", "c38fce04"], "commits": ["73aee4d", "73671fe"], "evidence": ["6631ec42:3735", "6631ec42:3744", "6631ec42:3745", "6631ec42:3766", "6631ec42:3803", "6631ec42:3815", "6631ec42:3816", "6631ec42:3831", "c:73aee4d", "6631ec42:3870", "6631ec42:3872", "c:73671fe", "c014a60d:0", "c38fce04:0"], "start": "2026-10-08", "end": "2026-10-08"}, {"id": "ep20", "title": "Self-hosted decision models: size comparison and a 9B fine-tune on rented GPUs", "summary": "The user then returned to self-hosted decision models, asking how close a model the company could host itself could get to Jev. The agent explained that Laya is a much smaller model than Jev, so a gap was expected, and ran Jev's tuned questions across base Laya, the project's own Laya fine-tune, Strands, Clef and Kev. A local Clef 9B run pushed the user's Mac into heavy swapping, so it was dropped for hosted Clef and local models ran one at a time under memory checks. Untrained, base Laya could not use the long policy-text questions; among untrained models, larger ones scored steadily better, and the old fine-tune beat a larger untrained model. When the user asked why the old fine-tune now scored much higher than before, the agent found the two numbers used different test cases and thresholds, and that the old fine-tune's training data overlapped part of the held-out set. On a budget-capped Modal account, the agent built one shared training set that excludes anything overlapping dev, held-out or public cases, then fine-tuned Kev-9B and retrained Laya on it. Kev was cut to one training pass after measuring step speed, and base-model scoring was split into parallel chunks after a run hit Modal's time limit and lost its results. The retrained Laya ranked cases better than the old fine-tune and no longer collapsed on public benchmarks, but stayed far behind Jev. The fine-tuned Kev-9B became the first self-hosted model to match Jev on F1, at modest training cost. Base Kev-9B scores were still pending and none of this was committed.", "outcome": "partial", "sessions": ["6631ec42"], "commits": [], "evidence": ["6631ec42:3858", "6631ec42:3870", "6631ec42:3873", "6631ec42:3932", "6631ec42:3960", "6631ec42:3964", "6631ec42:3889", "6631ec42:3940", "6631ec42:3984", "6631ec42:3995", "6631ec42:4054", "6631ec42:4084", "6631ec42:4069", "6631ec42:5167", "6631ec42:5177"], "start": "2026-10-08", "end": "2026-10-08"}, {"id": "ep21", "title": "One held-out test set, run fresh, for every guard", "summary": "The user required every F1 shown anywhere to come from exactly the same evaluation set, never from data used in training. The agent found earlier figures mixed test sets: agentic-security had been scored on fewer cases on one set because it does not screen plain replies, and the size table combined two sets. The user also questioned any caching. The agent confirmed nothing deployed has a cache, but found that lab reruns of an unchanged guard had reused saved verdicts and that promptfoo's own cache could not be confirmed off, so every lab and red-team run was switched to fresh inference. A single held-out comparison harness then scored every hosted guard and judge fresh on the same cases, after cases overlapping AgentDojo-derived data were excluded for every guard at the user's choice. Models were renamed to readable names such as laya-tuned. When the user said nobody would understand 'canonical' versus 'public', the two test sets were renamed to plain descriptions and the README gained a plain-language section on how guards are tested, with thanks to each dataset's authors. Jev scored highest of the hosted guards on the shared set, with both judges close behind. None of this was committed yet.", "outcome": "partial", "sessions": ["6631ec42"], "commits": [], "evidence": ["6631ec42:3967", "6631ec42:3995", "6631ec42:3996", "6631ec42:3997", "6631ec42:4005", "6631ec42:4006", "6631ec42:4077", "6631ec42:5027", "6631ec42:5097", "6631ec42:5098", "6631ec42:5147", "6631ec42:5167"], "start": "2026-10-08", "end": "2026-10-08"}, {"id": "ep22", "title": "Documenting where the training and test data came from", "summary": "While training ran, the user asked for one document covering the full training and test corpus with provenance and licenses, plus a section on datasets that could extend training later. The agent wrote docs/data-provenance.md, covering every training es excluded", "why": "The user required like-for-like numbers never touched by training; the agent found mixed sets, reused results and the old fine-tune's training overlap with the held-out set.", "evidence": ["6631ec42:3967", "6631ec42:3995", "6631ec42:3997", "6631ec42:5027"], "date": "2026-10-08", "chapter": "ch7"}], "shipped": [{"what": "s1guard: a zero-shot System One classifier with a LiteLLM guardrail and promptfoo evals, later moved to experiments/", "commits": ["db5328e"], "evidence": ["c:db5328e", "6631ec42:88"], "date": "2026-09-30"}, {"what": "Per-stage detection benchmark, local Laya fine-tuning pipeline, and fine-tuned models with context-aware checks", "commits": ["06e5ffd"], "evidence": ["c:06e5ffd", "6631ec42:398"], "date": "2026-10-02"}, {"what": "Showdown harness and hybrid policy comparing s1guard with public guards", "commits": ["f1bbd99"], "evidence": ["c:f1bbd99", "6631ec42:1156"], "date": "2026-10-04"}, {"what": "guardlab evaluation lab: guard registry, adapters for LLM judges, decision APIs and open-source guards, and public benchmark sets", "commits": ["af123e8"], "evidence": ["c:af123e8", "6631ec42:1413", "6631ec42:2010"], "date": "2026-10-04"}, {"what": "Consolidated LLM judge whose calls are billed to the caller's gateway key, with Llama Guard 4 served locally", "commits": ["faacd26"], "evidence": ["c:faacd26", "6631ec42:2141", "6631ec42:2143"], "date": "2026-10-05"}, {"what": "Guard lineup regrouped by inference ownership, with DeBERTa and Strands Decider added and a roadmap", "commits": ["f58c099"], "evidence": ["c:f58c099", "6631ec42:2418"], "date": "2026-10-05"}, {"what": "Pre-call placement, a trajectory-aware tool-call check, and a fail-open gateway guard", "commits": ["2b6a283"], "evidence": ["c:2b6a283", "6631ec42:2613"], "date": "2026-10-05"}, {"what": "Standalone agent-loop eval on AgentDojo and AgentThreatBench", "commits": ["c238a2b"], "evidence": ["c:c238a2b", "6631ec42:2697"], "date": "2026-10-05"}, {"what": "Refusal-style blocks and verified chargeback on every request path", "commits": ["7337259"], "evidence": ["c:7337259", "6631ec42:2865"], "date": "2026-10-05"}, {"what": "Prompt-section ablation, a cyber-only eval slice, and the cyber policy hardening spec", "commits": ["6c775d8", "175dc2c"], "evidence": ["c:6c775d8", "c:175dc2c", "6631ec42:2961"], "date": "2026-10-06"}, {"what": "Cyber policy v4, a README centered on the comparison lab, and model-neutral judge names", "commits": ["feab7a6", "44a9f25"], "evidence": ["c:feab7a6", "c:44a9f25", "01a11125:308"], "date": "2026-10-06"}, {"what": "agentic-security, a drop-in LiteLLM guardrail with surgical withholding, and deployment docs that recommend it", "commits": ["5000ebc", "2004054"], "evidence": ["c:5000ebc", "c:2004054", "6631ec42:3616"], "date": "2026-10-07"}, {"what": "Evidence that agentic-security stops attacks against a weaker agent, a clean four-setup rerun, and the rejected tuning round documented", "commits": ["0e392b8"], "evidence": ["c:0e392b8", "6631ec42:3728"], "date": "2026-10-08"}, {"what": "Jev evaluated and tuned as a hosted decision-API guardrail and pre-filter, with a README that leads with active work and the best-performing options", "commits": ["73aee4d", "73671fe"], "evidence": ["c:73aee4d", "c:73671fe", "6631ec42:3870"], "date": "2026-10-08"}], "lessons": [{"text": "An in-house model that wins on its own test data has not yet won: the fine-tuned classifier led only on a benchmark it had been tuned on, and lost to off-the-shelf classifiers on clean public sets.", "evidence": ["6631ec42:1220", "6631ec42:1291"]}, {"text": "The original idea of a fast in-house decision model was held back by model size: retrained on clean data, the small model still trailed the hosted decision model well behind, while a larger open model fine-tuned on the same data with rented GPUs matched it at low cost.", "evidence": ["6631ec42:3960", "6631ec42:5167", "6631ec42:5177"]}, {"text": "Most reversals came from how results were measured, not from the code: benchmark leakage, a shifted baseline, shared API rate limits, reused lab results and scores drawn from different test sets each produced numbers that had to be re-run before a decision could stand. The fix was one held-out set scored fresh for every option.", "evidence": ["6631ec42:1220", "6631ec42:2146", "6631ec42:3447", "6631ec42:3012", "01a11125:256", "6631ec42:3995", "6631ec42:3997"]}, {"text": "Billing rules decide where a guardrail can sit: blocking mid-call cancels inference with no spend record, so checks run before and after the model call and blocks come back as normal refusals that are still billed.", "evidence": ["6631ec42:2474", "6631ec42:2865"]}, {"text": "Guardrails must be tested inside a real agent workflow, not only on single prompts: the agent-loop eval showed that hard error blocks ended whole agent tasks, which led to refusal-style blocks.", "evidence": ["6631ec42:2768", "6631ec42:2784"]}, {"text": "A guardrail's protection only shows against an agent that can be fooled: a strong model resisted the test attacks on its own, so task-completion figures said little, and only a weaker agent's attack-success figures showed what the guardrail stopped.", "evidence": ["6631ec42:3720", "6631ec42:3723", "6631ec42:3728"]}, {"text": "State the deployment constraints up front: the no-cache, drop-in-file requirement surfaced only after cyber-guard had been tuned around a cache, and a much simpler design built to that constraint matched it and let more agent tasks finish.", "evidence": ["6631ec42:3199", "6631ec42:3203", "6631ec42:3616"]}, {"text": "Security testing runs into AI providers' own safety controls: OpenAI flagged biological-risk test traffic, forcing a cyber-only scope, and Claude's safety classifier stopped it writing hardened cyber policy text, so that wording was delegated to a Codex session through a written spec.", "evidence": ["6631ec42:1771", "6631ec42:2899", "01a11125:1"]}, {"text": "AI agents need explicit rules for blockers and plan changes: the agent pushed past an unfunded API key and silently dropped planned guards until the user stepped in. Once stated, the stop-when-blocked rule held: the agent halted an unattended overnight run when API credits ran out.", "evidence": ["6631ec42:1489", "6631ec42:1933", "6631ec42:3815"]}, {"text": "Automated security reviews of each change found real weaknesses, but the record shows a fix only for the finding raised inside the working session; findings from separate review sessions have no recorded follow-up.", "evidence": ["8fb2a704:11", "6af26f48:7", "0cf702a0:9", "6631ec42:3575"]}], "open_threads": [{"text": "agentic-security still lets autonomy-hijack attacks through, trails cyber-guard slightly on cyber recall (a wording-only tuning round failed, so the fix needs the shared cyber policy), and raises false alarms on delegated requests such as doing the tasks in a file.", "evidence": ["6631ec42:3616", "6631ec42:3720", "6631ec42:3728"]}, {"text": "Surgical cuts are not re-verified before the remaining text reaches the model; an optional verification setting was offered but not built.", "evidence": ["6631ec42:3614"]}, {"text": "The attack types the user's work evals catch but cyber-guard misses remain unmeasured, since no sanitized cases were available; the roadmap lists generalizing the cyber instructions later.", "evidence": ["6631ec42:3052", "6631ec42:3617", "01a11125:249"]}, {"text": "The cost of during-call checks and of judge calls that time out is still not billed.", "evidence": ["6631ec42:2865"]}, {"text": "cyber-guard's lab integration still has the billing-spoof flaw fixed in agentic-security, noted as needing the same fix if it is ever deployed.", "evidence": ["6631ec42:3632"]}, {"text": "Security review findings with no recorded fix: the forged-assistant-turn bypass in s1guard screening, unescaped trusted_context text in the judge prompt, and injections placed past the encoder's window cap.", "evidence": ["8fb2a704:11", "6af26f48:7", "0cf702a0:9"]}, {"text": "OpenAI's Decisions API is still to be compared with Jev once it is generally available, a decision-model check at the LiteLLM layer like agentic-security is not built, and proposed ideas to cut guarded-request latency were not applied.", "evidence": ["6631ec42:1554", "6631ec42:3867", "6631ec42:3873", "6631ec42:2449"]}, {"text": "The latest work is uncommitted: the Modal training apps, the single held-out comparison harness, the provenance document, and the plain-language test-set names and README rewrite.", "evidence": ["6631ec42:5097", "6631ec42:5147", "6631ec42:5167"]}, {"text": "Base Kev-9B scores are pending, so what fine-tuning added is not yet shown; the model-size write-up and the README's self-hosted row wait on them.", "evidence": ["6631ec42:5177"]}, {"text": "The old Laya fine-tune's public-benchmark results are not clean because it trained on some public cases, and the held-out set has few tool-definition and tool-result cases, so per-stage scores there are only indicative.", "evidence": ["6631ec42:5097"]}]}, "commits": [{"sha": "b6ab67f", "date": "2026-09-30", "subject": "Initial commit", "session": null, "revert": false}, {"sha": "db5328e", "date": "2026-09-30", "subject": "Add s1guard System One runtime guardrail with LiteLLM integration and promptfoo evals", "session": "6631ec42", "revert": false}, {"sha": "06e5ffd", "date": "2026-10-02", "subject": "Add detection benchmark and local Laya fine-tuning; context-aware checks (v4)", "session": "6631ec42", "revert": false}, {"sha": "f1bbd99", "date": "2026-10-04", "subject": "Add guardrail showdown, hybrid policy, classifier risks; pin deps", "session": "6631ec42", "revert": false}, {"sha": "af123e8", "date": "2026-10-04", "subject": "Restructure into a cyber-security guardrail evaluation lab", "session": "6631ec42", "revert": false}, {"sha": "faacd26", "date": "2026-10-05", "subject": "Add consolidated judge, gateway chargeback, direct-injection tuning, Llama Guard 4",
