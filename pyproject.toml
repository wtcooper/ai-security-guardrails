[project]
name = "s1guard"
version = "0.1.0"
description = "System One runtime guardrail classifier for OWASP LLM / MCP / Agentic Top 10 and MITRE ATLAS risks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6",
]

[project.optional-dependencies]
# In-process open-weight backend (convaiinnovations/laya, Apache-2.0)
laya = ["laya>=0.3.22"]
# LiteLLM gateway integration (custom guardrail)
gateway = ["litellm[proxy]>=1.88"]
dev = ["pytest>=8"]

[project.scripts]
s1guard = "s1guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s1guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
