# Local LiteLLM gateway with the s1guard System One guardrail.
#   bash gateway/start_gateway.sh          # :4000, master key sk-local
#
# s1guard is a NAMED guardrail (not default_on) so evals can A/B it per request:
#   {"model": "gemma4:e2b", "guardrails": ["s1guard"], "messages": [...]}
# Set default_on: true to enforce it on every request.

model_list:
  # Local Ollama models (no keys, no spend). `ollama serve` + `ollama pull <model>`.
  # think: false -- gemma4 otherwise spends max_tokens on hidden reasoning and returns empty content.
  - model_name: gemma4
    litellm_params: {model: ollama/gemma4, api_base: http://localhost:11434, timeout: 600, num_ctx: 16384, think: false}
  - model_name: gemma4:e2b
    litellm_params: {model: ollama/gemma4:e2b, api_base: http://localhost:11434, timeout: 600, num_ctx: 16384, think: false}
  - model_name: qwen3.5
    litellm_params: {model: ollama/qwen3.5, api_base: http://localhost:11434, timeout: 600, num_ctx: 16384, think: false}

  # Hosted model used by both inference and the LLM-as-a-judge guardrail (one deployment, one spend ledger).
  - model_name: gpt-6-luna
    litellm_params: {model: openai/gpt-6-luna, api_key: os.environ/OPENAI_API_KEY}

  # Deterministic mock for guardrail-isolation evals: replies per the trailing assistant-message
  # directive (MOCK_OUTPUT: / MOCK_TOOL_CALL:), see gateway/mock_llm.py.
  - model_name: mock-echo
    litellm_params: {model: mock-echo/echo}

litellm_settings:
  custom_provider_map:
    - {provider: mock-echo, custom_handler: mock_llm.mock_echo}

guardrails:
  - guardrail_name: s1guard
    litellm_params:
      guardrail: s1guard.litellm_guardrail.S1Guardrail
      mode: [pre_call, post_call, pre_mcp_call, post_mcp_call]
      default_on: false
  # Any guardlab registry guard (src/guardlab/guards.yaml) via one generic guardrail class.
  - guardrail_name: judge-luna
    litellm_params:
      guardrail: guardlab.litellm_guardrail.LabGuardrail
      mode: [pre_call, post_call, pre_mcp_call, post_mcp_call]
      default_on: false
      guard_id: judge-luna
      on_unavailable: block
  # Same judges, but their luna calls go through THIS gateway's router with the caller's key metadata,
  # so LiteLLM writes each judge call to the spend DB against the calling team key (chargeback).
  - guardrail_name: judge-luna-gw
    litellm_params:
      guardrail: guardlab.litellm_guardrail.LabGuardrail
      mode: [pre_call, post_call, pre_mcp_call, post_mcp_call]
      default_on: false
      guard_id: judge-luna-gw
      on_unavailable: block
  - guardrail_name: judge-luna-consolidated-gw
    litellm_params:
      guardrail: guardlab.litellm_guardrail.LabGuardrail
      mode: [pre_call, post_call, pre_mcp_call, post_mcp_call]
      default_on: false
      guard_id: judge-luna-consolidated-gw
      on_unavailable: block
  # Recommended placement (docs/guardrail-placement.md): screen everything entering inference (user turns,
  # tool results, tool definitions) before the model reads it; check the model's tool calls before they
  # run; skip plain-text replies (no post-call latency on chat). No MCP hooks: tool results reach the
  # next inference anyway. pre_call (not during_call), so a block never cancels billed inference.
  - guardrail_name: cyber-guard
    litellm_params:
      guardrail: guardlab.litellm_guardrail.LabGuardrail
      mode: [pre_call, post_call]
      default_on: false
      guard_id: judge-luna-consolidated-gw
      on_unavailable: allow   # fail open: judge down, erroring or over budget -> inference proceeds (logged)
      deadline_s: 10          # total time budget per hook (normal p95 ~3 s)
      stages: [input, conversation, tool_result, tool_definition, tool_call]
      skip_tools: []          # exact names of vetted tools only; unknown tools are always checked
  # Same guard, pre-call only: the agent-loop eval's middle arm (isolates what post-call adds).
  - guardrail_name: cyber-guard-pre
    litellm_params:
      guardrail: guardlab.litellm_guardrail.LabGuardrail
      mode: [pre_call]
      default_on: false
      guard_id: judge-luna-consolidated-gw
      on_unavailable: allow
      deadline_s: 10
      stages: [input, conversation, tool_result, tool_definition]
  - guardrail_name: dec-luna-emu
    litellm_params:
      guardrail: guardlab.litellm_guardrail.LabGuardrail
      mode: [pre_call, post_call, pre_mcp_call, post_mcp_call]
      default_on: false
      guard_id: dec-luna-emu
      on_unavailable: block

general_settings:
  master_key: sk-local
