# Guard-only comparison: every guard sees the same standardized corpus; the guard's own
# block/pass decision is scored with `guardrails` / `not-guardrails` (no model, no judge).
#
#   uv run python evals/lab/build_corpus.py          # -> data/pf/lab_tests.json
#   bash evals/run.sh lab smoke-dev 'regex|laya-tuned-0.4b-stockq'    # modes: smoke-dev | smoke-test | dev | test
description: "guardrail lab: guard-only comparison on the standardized corpus"

env:
  PROMPTFOO_DISABLE_TELEMETRY: "true"
  PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"

evaluateOptions:
  cache: false          # guardlab caches per guard version itself
  maxConcurrency: 4

prompts: ["{{case_id}}"]  # the provider reads vars directly; corpus text is never templated

# One provider per registry guard (src/guardlab/guards.yaml); label = guard id.
# Select guards per run: bash evals/run.sh lab <mode> '<label regex>'
# Local-model guards use `workers: 1` (one model copy in memory); API guards scale with -j.
providers:
  - {id: file://provider_guard.py, label: regex, config: {guard: regex}}
  - {id: file://provider_guard.py, label: laya-base-0.4b-stockq, config: {guard: laya-base-0.4b-stockq, workers: 1}}
  - {id: file://provider_guard.py, label: laya-tuned-0.4b-stockq, config: {guard: laya-tuned-0.4b-stockq, workers: 1}}
  - {id: file://provider_guard.py, label: cyber-guard-per-policy, config: {guard: cyber-guard-per-policy}}
  - {id: file://provider_guard.py, label: cyber-guard-per-policy-single, config: {guard: cyber-guard-per-policy-single}}
  - {id: file://provider_guard.py, label: cyber-guard, config: {guard: cyber-guard}}
  - {id: file://provider_guard.py, label: agentic-security, config: {guard: agentic-security}}
  - {id: file://provider_guard.py, label: agentic-security-sys, config: {guard: agentic-security-sys}}
  - {id: file://provider_guard.py, label: cyber-guard-per-policy-think, config: {guard: cyber-guard-per-policy-think}}
  - {id: file://provider_guard.py, label: cyber-guard-combined, config: {guard: cyber-guard-combined}}
  - {id: file://provider_guard.py, label: cyber-guard-per-policy-smoke, config: {guard: cyber-guard-per-policy-smoke}}
  - {id: file://provider_guard.py, label: dec-openai, config: {guard: dec-openai}}
  - {id: file://provider_guard.py, label: judge-abl-single, config: {guard: judge-abl-single}}
  - {id: file://provider_guard.py, label: judge-abl-nocommon, config: {guard: judge-abl-nocommon}}
  - {id: file://provider_guard.py, label: judge-abl-nodefs, config: {guard: judge-abl-nodefs}}
  - {id: file://provider_guard.py, label: judge-abl-nodefs-cyber, config: {guard: judge-abl-nodefs-cyber}}
  - {id: file://provider_guard.py, label: judge-abl-withexamples, config: {guard: judge-abl-withexamples}}
  - {id: file://provider_guard.py, label: dec-luna-emu, config: {guard: dec-luna-emu}}
  - {id: file://provider_guard.py, label: jev-base-stockq, config: {guard: jev-base-stockq}}
  - {id: file://provider_guard.py, label: jev-base, config: {guard: jev-base}}
  - {id: file://provider_guard.py, label: laya-base-0.4b, config: {guard: laya-base-0.4b, workers: 1}}
  - {id: file://provider_guard.py, label: laya-tuned-0.4b, config: {guard: laya-tuned-0.4b, workers: 1}}
  - {id: file://provider_guard.py, label: strands-base-2b, config: {guard: strands-base-2b, workers: 1}}
  - {id: file://provider_guard.py, label: clef-base-9b-ollama, config: {guard: clef-base-9b-ollama, workers: 1}}
  - {id: file://provider_guard.py, label: strands-base-2b-stockq, config: {guard: strands-base-2b-stockq, workers: 1}}
  - {id: file://provider_guard.py, label: clef-base-9b-stockq, config: {guard: clef-base-9b-stockq, workers: 1}}
  - {id: file://provider_guard.py, label: pg2-86m, config: {guard: pg2-86m, workers: 1}}
