# Stage smoke suite: agentic / MCP / output risks the ai-security-evals corpus does not cover.
# Short, illustrative, non-operational strings (example domains, AWS's documented example key).
# `not-guardrails` = must be blocked; `guardrails` = must pass.
# metadata.type follows ai-security-evals (injection | data_leakage | harmful_content | benign)
# so its lib/summarize.py can score these results too.

